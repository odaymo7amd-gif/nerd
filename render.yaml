services:
  - type: web
    name: nerd
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: nerd-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      # أول حساب يُسجَّل على قاعدة جديدة يأخذ id=1 ويصبح حساب المطوّر.
      - key: ADMIN_USER_ID
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: AI_PROVIDER
        value: Groq
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: AI_ALLOWED_MODELS
        value: openai/gpt-oss-120b,openai/gpt-oss-20b
      - key: AI_TIMEOUT_MS
        value: "90000"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "1600"
      # يُملأ بعد أول نشر بالرابط الفعلي، ويُستخدم في روابط استعادة كلمة المرور.
      - key: APP_URL
        sync: false
      # اختياري: تسليم رسائل استعادة كلمة المرور.
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
